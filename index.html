<!DOCTYPE html>
<html lang = "en" data-theme = "light">
<head>
    <meta charset = "UTF-8">
    <meta name = "viewport" content = "width =device-width, initial-scale = 1.0">
    
    <!-- Iconify icons -->
    <script src = "https://code.iconify.design/1/1.0.7/iconify.min.js"></script>

    <link id = "favicon" rel = "icon" type = "image/png">
    <script>
        const canvas = document.createElement("canvas");
        canvas.width = 65;
        canvas.height = 65;
        const context = canvas.getContext("2d");

        // background
        context.fillStyle="#34334f";
        context.fillRect(0,0,65,65);
        context.fillStyle="#ffffff";
        context.fillRect(9,9,46,46);

        //lines
        context.strokeStyle="b9b8e8";
        context.lineWidth = 2;
        for (const position of [24, 39])
        {
            context.beginPath();
            context.moveTo(position, 9);
            context.lineTo(position, 55);
            context.stroke();
            context.beginPath();
            context.moveTo(9, position);
            context.moveTo(55, position);
            context.stroke();
        }

        context.fillStyle="#dedcff";
        context.fillRect(25,25,13,13);
        context.fillStyle = "#4c47bf";
        context.font="bold 12px Times New Roman";
        context.textAlign = "center";
        context.textBaseline = "middle";
        context.fillText("3", 35, 35);
        document.getElementById("favicon").href=canvas.toDataURL("image/png");
    </script>  

    <title>Sudoku</title>
    <link rel = "stylesheet" href = "style.css">
</head>

<body>
    <div class="game">
        <header class = "topbar">
            <div>
                <div class = "brand">数独库</div>
                <div class = "muted">挑战自我</div>
            </div>
            <div class = "top-actions">
                <button
                    class="theme-toggle"
                    id="theme-toggle"
                    type="button"
                    aria-label="Switch to dark theme"
                    aria-pressed="false"
                >
                    <svg class="theme-icon theme-icon--moon" viewBox="0 0 24 24" aria-hidden="true">
                        <path class="moon-half" d="M12 3a9 9 0 0 0 0 18V3Z" />
                        <circle class="moon-outline" cx="12" cy="12" r="9" />
                    </svg>
                    <svg class="theme-icon theme-icon--sun" viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="12" cy="12" r="4" />
                        <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" />
                    </svg>
                    <span id="theme-label">Light</span>
                </button>
                <button class = "primary" id = "new-game" type = "button">New Game</button>
            </div>
        </header>

        <div class="workspace">
            <aside class="sidebar">
                <p class="section-label">Workspace</p>
                <button class="side-link active" type="button">▦ &nbsp; Play</button>
                <p class="section-label difficulty-label">Difficulty</p>
                <button class="side-link" data-difficulty = "easy" type="button">Easy</button>
                <button class="side-link" data-difficulty ="medium" type="button">Medium</button>
                <button class="side-link" data-difficulty = "hard" type="button">Hard</button>
            </aside>

            <main class="puzzle-area">
                <p id = "prompt" role = "status">
                    Choose a diffculty to Start!
                </p>
                <div id="sudoku-board" aria-label="Sudoku board" hidden></div>
            </main>

            <aside class="right-panel">
                <div class = "game-details">
                    <div>
                        <p class = "rhs-heading">GAME TOOLS</p>
                        <h2>Session</h2>
                    </div>
                    <div class = "time">
                        <span class = "rhs-heading">TIME</span>
                        <time id = "timer">00:00</time>
                    </div>
                </div>

                <button class = "hint-button" id = "hint-button" type="button">
                    <span class = "hint-icon" aria-hidden ="true">✦</span>
                    <span class = "hint">
                        <strong>HINT</strong>
                        <small><span id = "hints-remaining">3</span></small>
                    </span>
                </button>

                <div class = "tool-buttons">
                    <button class = "button-tools" type ="button" aria-label =
                    "Undo" title = "Undo">
                        <svg viewBox = "0 0 24 24" aria-hidden = "true">
                            <path d = "M9 14 4 915-5M4 9h10a6 6 0 0 1 6 6v1"/>
                        </svg>
                        <span>Undo</span>
                    </button>
                    <button class = "button-tools" type ="button" aria-label =
                    "Redo" title = "Redo">
                        <svg viewBox = "0 0 24 24" aria-hidden = "true">
                            <path d = "m15 4 5 5-5 5m5-5H10a6 6 0 0 1 6 6v1"/>
                        </svg>
                        <span>Redo</span>
                    </button>
                </div>
                <p class = "keyboard-shortcut">
                    <kbd>1-9</kbd>
                    <span aria-hidden = "true">.</span>
                    <kbd>← ↑ ↓ →</kbd> move
                    <span aria-hidden ="true">.</span>
                    <kbd>Backspace</kbd> clear
                </p>
            </aside>
        </div>
    </div>

    <script type="module" src="./JS/main.js"></script>
</body>

</html>
